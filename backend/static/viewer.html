<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront · Live</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --ok: #4ade80;
    --warn: #fbbf24;
    --off: #71717a;
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg); font: 600 16px/1.25 var(--font);
  }
  #app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; }
  #video, #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; }
  #overlay { pointer-events: none; }
  #waiting {
    position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    text-align: center; color: var(--muted); font-size: clamp(24px, 4.5vh, 56px);
  }
  #badge {
    position: absolute; top: clamp(12px, 2.5vh, 32px); right: clamp(12px, 2vw, 32px);
    display: flex; align-items: center; gap: 0.5em; padding: 0.45em 0.95em;
    border-radius: 999px; background: rgba(0, 0, 0, 0.65);
    font-size: clamp(16px, 3vh, 34px); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #badge .dot { width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--off); }
  #badge[data-state="ok"] .dot { background: var(--ok); }
  #badge[data-state="stale"] .dot, #badge[data-state="offline"] .dot { background: var(--warn); }
  /* The item the user picked, and where to buy it: filled from "look" events. */
  #look, #look-results { display: flex; flex-direction: column; gap: 1.4vh; }
  #look {
    flex: 0 0 min(34vw, 560px); padding: 2.5vh 2vw; overflow: hidden;
    background: #141418; border-left: 1px solid #26262b; font-size: clamp(16px, 2.5vh, 30px);
  }
  .thumb { overflow: hidden; border-radius: 0.35em; background: #26262b; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #look-crop { flex: 0 1 26vh; min-height: 0; background: #0a0a0c; }
  #look-crop img { object-fit: contain; }
  #look-name { font-size: 1.3em; font-weight: 800; line-height: 1.1; }
  #look-desc, #look-status, .verdict, .store, .reason, .summary { color: var(--muted); font-weight: 500; }
  #look-desc, .verdict, .reason { font-size: 0.68em; }
  #look-desc, .ptitle, .reason {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  #look-status { font-size: 0.8em; }
  #look-status.busy { animation: pulse 1.4s ease-in-out infinite; }
  #look-status.error { color: var(--warn); }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .chip {
    display: inline-block; margin-right: 0.5em; padding: 0.1em 0.55em; border-radius: 999px;
    background: #e4e4e7; color: #0a0a0c; font-weight: 800;
  }
  .chip.low { background: var(--ok); }
  .chip.high { background: #f87171; }
  .best, .row { display: grid; grid-template-columns: auto 1fr auto; gap: 0.6em; align-items: center; }
  .best { padding: 0.5em; border-radius: 0.5em; background: #1c1c22; border: 1px solid #2e2e35; }
  .best .thumb { width: 3.6em; height: 3.6em; }
  .row { padding: 0.2em 0; }
  .row .thumb { width: 2em; height: 2em; }
  .info { min-width: 0; }
  .tag { font-size: 0.55em; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ok); }
  .ptitle { font-size: 0.75em; }
  .row .ptitle { -webkit-line-clamp: 1; }
  .store { font-size: 0.6em; }
  .save { color: var(--ok); font-weight: 800; }
  .price { font-size: 1.05em; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .best .price { font-size: 1.35em; }
  .reason { margin-top: 0.2em; font-size: 0.6em; }
  .group h2 {
    margin: 0 0 0.2em; font-size: 0.55em; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .summary { font-size: 0.8em; }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="waiting">Waiting for video…</div>
    <div id="badge" data-state="off"><span class="dot"></span><span id="badge-text">Connecting…</span></div>
  </main>
  <aside id="look" hidden aria-live="polite">
    <div id="look-crop" class="thumb"><img alt=""></div>
    <div id="look-name"></div>
    <div id="look-desc"></div>
    <div id="look-status"></div>
    <div id="look-results"></div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
<script>
"use strict";
const stage = document.getElementById("stage");
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const waiting = document.getElementById("waiting");
const badge = document.getElementById("badge");
const badgeText = document.getElementById("badge-text");

const MOVE_MS = 150;      // a label glides to its new position
const FADE_IN_MS = 80;
const FADE_OUT_MS = 200;  // a label missing from the latest update fades out
const STALE_S = 10;       // the badge turns amber when the boxes are older than this
const DIM = 0.35;         // the other labels, while one is picked
const TOP = 4;            // labels shown in full; the other labeled objects get a dot
const W_SCORE = 0.2, W_SIZE = 0.8; // how labels are ranked: SAM's score and the box's share of the frame
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();

// Positions arrive a few times a second; between updates each label stays where it was last seen.
const tracks = new Map(); // uid -> {uid, label, from, to, t0, born, gone}
const names = new Map();  // uid -> its quick label: {name, price_low, price_high}
let updatedAt = null;     // performance.now() when the frame behind the latest boxes was captured
let count = 0;
let tracking = "connecting";

function ease(k) { return 1 - Math.pow(1 - k, 3); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

function boxAt(t, now) {
  const k = ease(Math.min(1, (now - t.t0) / MOVE_MS));
  return t.from.map((v, i) => v + (t.to[i] - v) * k);
}

function alphaAt(t, now) {
  const a = Math.min(1, (now - t.born) / FADE_IN_MS);
  return t.gone === null ? a : a * Math.max(0, 1 - (now - t.gone) / FADE_OUT_MS);
}

function fadeAll(now) {
  for (const t of tracks.values()) if (t.gone === null) t.gone = now;
}

function onObjects(ev) {
  const now = performance.now();
  if (!ev.objects.length) { fadeAll(now); names.clear(); updatedAt = null; return; } // tracking restarted
  updatedAt = now - ev.age_ms;
  const inView = ev.objects.filter((o) => o.in_view); // scene memory also lists objects that left
  count = inView.length;
  const seen = new Set();
  for (const o of inView) {
    const [x1, y1, x2, y2] = o.box, box = [x1, y1, x2 - x1, y2 - y1];
    const t = tracks.get(o.uid);
    seen.add(o.uid);
    if (t) {
      t.from = boxAt(t, now);
      t.born = now - alphaAt(t, now) * FADE_IN_MS; // fading out: fade back in from where it is
      t.to = box; t.t0 = now; t.gone = null; t.label = o.prompt; t.score = o.score;
    } else {
      tracks.set(o.uid, { uid: o.uid, label: o.prompt, score: o.score, from: box, to: box, t0: now, born: now,
                          gone: null });
    }
  }
  for (const [uid, t] of tracks) if (!seen.has(uid) && t.gone === null) t.gone = now;
}

function handle(ev) {
  if (ev.type === "objects") {
    onObjects(ev);
  } else if (ev.type === "label") {
    names.set(ev.uid, { ...ev, at: performance.now() });
  } else if (ev.type === "status") {
    tracking = ev.tracking;
    if (tracking === "stopped") { fadeAll(performance.now()); names.clear(); updatedAt = null; }
  } else if (ev.type === "look" && ev.selected) {
    showLook(ev);
  }
}

// ---------- the Look panel: the item the user picked, and where to buy it ----------

const panel = document.getElementById("look");
const crop = document.getElementById("look-crop");
const cropImg = crop.querySelector("img");
const nameEl = document.getElementById("look-name");
const descEl = document.getElementById("look-desc");
const statusEl = document.getElementById("look-status");
const resultsEl = document.getElementById("look-results");
const VERDICT = { low: "Good price", fair: "Fair price", high: "Pricey" };
const EXACT = 85;         // match_score from here up is an "Exact match"
let look = null;          // the Look on the panel: {look_id, uid, name, price}
const picks = new Set();  // look_ids of every pick so far: the newest one is on the panel

// Each "look" message carries the whole Look so far, so the panel is drawn from it alone.
function showLook(ev) {
  if (!picks.has(ev.look_id)) picks.add(ev.look_id); // a new pick takes the panel
  else if (!look || ev.look_id !== look.look_id) return; // an older pick, already replaced
  look = { look_id: ev.look_id, uid: ev.uid, name: cap((ev.item && ev.item.category) || ev.label), price: null };
  panel.hidden = false;
  crop.hidden = !ev.crop_url;
  if (ev.crop_url && cropImg.getAttribute("src") !== ev.crop_url) cropImg.src = ev.crop_url;
  nameEl.textContent = look.name;
  descEl.textContent = (ev.item && ev.item.description) || "";
  resultsEl.replaceChildren();
  if (ev.stage === "results") {
    look.price = ev.search.best_match ? money(ev.search.best_match) : null;
    setStatus("", "");
    showResults(ev.search);
  } else if (ev.stage === "failed") {
    setStatus(ev.message || "Couldn't get prices.", "error");
  } else {
    setStatus("Finding prices…", "busy");
  }
}

function setStatus(text, cls) {
  statusEl.textContent = text || "";
  statusEl.className = cls;
  statusEl.hidden = !text;
}

function showResults(s) {
  const parts = [];
  if (s.best_match) {
    const pi = s.price_insight;
    if (pi.verdict_text) {
      const v = el("div", "verdict");
      v.append(el("span", "chip " + pi.best_match_verdict, VERDICT[pi.best_match_verdict] || "Price"), pi.verdict_text);
      parts.push(v);
    }
    parts.push(card(s.best_match));
  } else {
    parts.push(el("div", "summary", s.spoken_summary));
  }
  if (s.dupes.length) parts.push(group("Cheaper dupes", s.dupes));
  if (s.used.length) parts.push(group("Used", s.used));
  resultsEl.replaceChildren(...parts);
}

function card(p) {
  const tag = p.match_score == null ? "Best match" : p.match_score >= EXACT ? "Exact match" : "Similar";
  const info = el("div", "info");
  info.append(el("div", "tag", tag), el("div", "ptitle", p.title), el("div", "store", p.store));
  if (p.match_reason) info.append(el("div", "reason", p.match_reason));
  const c = el("div", "best");
  c.append(thumb(p.image_url), info, el("div", "price", money(p)));
  return c;
}

function group(name, products) {
  const g = el("section", "group");
  g.append(el("h2", "", name));
  for (const p of products.slice(0, 2)) {
    const store = el("div", "store", p.store);
    if (p.savings_pct) store.append(" · ", el("span", "save", "Save " + p.savings_pct + "%"));
    const info = el("div", "info");
    info.append(el("div", "ptitle", p.title), store);
    const row = el("div", "row");
    row.append(thumb(p.image_url), info, el("div", "price", money(p)));
    g.append(row);
  }
  return g;
}

// Store data comes from the web: it only ever goes in as text, and images only from http(s) URLs.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function thumb(src) {
  const box = el("div", "thumb");
  let url = null;
  try { url = new URL(src, location.href); } catch (err) { /* no picture */ }
  if (src && url && (url.protocol === "https:" || url.protocol === "http:")) {
    const img = el("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => img.remove();
    img.src = url.href;
    box.append(img);
  }
  return box;
}

function priceRange(q) {
  return q.price_low === q.price_high ? "$" + q.price_low : "$" + q.price_low + "–" + q.price_high;
}

function money(p) {
  const digits = Number.isInteger(p.price) || p.price >= 100 ? 0 : 2;
  try {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: p.currency || "USD",
      minimumFractionDigits: digits, maximumFractionDigits: digits }).format(p.price);
  } catch (err) { // an unknown currency code
    return "$" + p.price.toFixed(digits);
  }
}

// ---------- drawing ----------

let cw = 0, ch = 0, dpr = 0;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, r = window.devicePixelRatio || 1;
  if (w === cw && h === ch && r === dpr) return;
  cw = w; ch = h; dpr = r;
  canvas.width = Math.round(w * r);
  canvas.height = Math.round(h * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
}

function videoRect() {
  const iw = video.videoWidth, ih = video.videoHeight;
  if (!iw || !ih) return null;
  const s = Math.min(cw / iw, ch / ih), w = iw * s, h = ih * s;
  return { x: (cw - w) / 2, y: (ch - h) / 2, w: w, h: h };
}

function roundRect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Only objects with a quick label are drawn, at the middle of their box; no boxes. The TOP best ranked get a
// small pill with the label, the rest a dot saying something was found. picked: the text for the object the
// user picked (a pill with a glow, always).
function rank(t, b) {
  return W_SCORE * t.score + W_SIZE * b[2] * b[3];
}

function drawLabel(t, b, alpha, v, font, full, picked) {
  const q = names.get(t.uid);
  if (!picked && !q) return;
  if (q) alpha *= Math.min(1, (performance.now() - q.at) / FADE_IN_MS); // fades in as it pops up
  const cx = v.x + (b[0] + b[2] / 2) * v.w, cy = v.y + (b[1] + b[3] / 2) * v.h;
  ctx.globalAlpha = alpha;
  if (!picked && !full) {
    ctx.beginPath();
    ctx.arc(cx, cy, font * 0.3, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 4;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    return;
  }
  const text = picked || cap(q.name) + "  ·  " + priceRange(q);
  ctx.font = "600 " + font + "px " + FONT;
  const pad = font * 0.6, tw = ctx.measureText(text).width + pad * 2, th = font * 1.8;
  const lx = Math.max(v.x, Math.min(cx - tw / 2, v.x + v.w - tw));
  const ly = Math.max(v.y, Math.min(cy - th / 2, v.y + v.h - th));
  frosted(lx, ly, tw, th, th * 0.3, v);
  ctx.lineWidth = picked ? 1.5 : 1;
  ctx.strokeStyle = picked ? "rgba(255, 255, 255, 0.9)" : "rgba(255, 255, 255, 0.25)";
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.textBaseline = "middle";
  ctx.fillText(text, lx + pad, ly + th / 2 + font * 0.05);
  ctx.globalAlpha = 1;
}

// A rounded rectangle of blurred, darkened video: the pill's background. Leaves the path set for a stroke.
function frosted(x, y, w, h, r, v) {
  const sx = video.videoWidth / v.w, sy = video.videoHeight / v.h, m = 12; // margin: no clear edge from the blur
  ctx.save();
  roundRect(x, y, w, h, r);
  ctx.clip();
  ctx.filter = "blur(6px)";
  ctx.drawImage(video, (x - m - v.x) * sx, (y - m - v.y) * sy, (w + 2 * m) * sx, (h + 2 * m) * sy,
                x - m, y - m, w + 2 * m, h + 2 * m);
  ctx.filter = "none";
  ctx.fillStyle = "rgba(10, 10, 12, 0.45)";
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  roundRect(x, y, w, h, r);
}

let shownText = "", shownState = "";

function updateBadge(now) {
  let state = tracking === "offline" ? "offline" : "off", text;
  if (tracking === "connecting") text = "Connecting…";
  else if (tracking === "stopped") text = "Stopped";
  else if (tracking === "offline") text = "Tracking offline · retrying";
  else if (updatedAt === null) text = "Finding items…";
  else {
    const s = Math.max(0, Math.floor((now - updatedAt) / 1000));
    state = s > STALE_S ? "stale" : "ok";
    text = count + (count === 1 ? " item" : " items") + " · updated " + (s < 1 ? "just now" : s + "s ago");
  }
  if (text !== shownText) badgeText.textContent = shownText = text;
  if (state !== shownState) badge.dataset.state = shownState = state;
}

function draw() {
  const now = performance.now();
  resize();
  ctx.clearRect(0, 0, cw, ch);
  const v = videoRect();
  waiting.hidden = !!v;
  if (v) {
    const font = Math.round(Math.max(9, Math.min(v.h * 0.013, 13)));
    for (const [key, t] of tracks) if (t.gone !== null && alphaAt(t, now) <= 0) tracks.delete(key);
    const picked = look ? tracks.get(look.uid) : undefined;
    const labeled = [...tracks.values()].filter((t) => t !== picked && names.has(t.uid) && t.gone === null)
      .map((t) => ({ t, b: boxAt(t, now) })).sort((a, z) => rank(z.t, z.b) - rank(a.t, a.b));
    const top = new Set(labeled.slice(0, TOP).map((x) => x.t));
    for (const t of tracks.values()) {
      if (t !== picked) drawLabel(t, boxAt(t, now), alphaAt(t, now) * (picked ? DIM : 1), v, font, top.has(t));
    }
    if (picked) { // on top, labelled with what it is and its price
      const label = look.name + (look.price ? "  ·  " + look.price : "");
      drawLabel(picked, boxAt(picked, now), alphaAt(picked, now), v, font, true, label);
    }
  }
  updateBadge(now);
  requestAnimationFrame(draw);
}

// ---------- the session's LiveKit room, watch only ----------

const LK = LivekitClient;
const TOPIC = "updates";   // the backend's messages: data packets, and text streams for "look"
const BACKEND = "vision";  // its identity in the room
let room = null;

function clearVideo() {
  video.srcObject = null;
  video.removeAttribute("src");
}

async function join() {
  tracking = "connecting";
  let token;
  try {
    const r = await fetch("viewer-token", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "no session yet" : "HTTP " + r.status);
    token = await r.json();
  } catch (err) {
    setTimeout(join, 2000);  // no session yet, or the server is restarting
    return;
  }
  room = new LK.Room();
  room.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
    if (track.kind === "video" && participant.identity.startsWith("phone-")) track.attach(video);
  });
  room.on(LK.RoomEvent.TrackUnsubscribed, (track) => { track.detach(video); clearVideo(); });
  room.on(LK.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
    if (topic !== TOPIC || !participant || participant.identity !== BACKEND) return;
    try { handle(JSON.parse(new TextDecoder().decode(payload))); } catch (err) { /* not a message */ }
  });
  room.registerTextStreamHandler(TOPIC, async (reader, from) => {
    if (from.identity !== BACKEND) return;
    try { handle(JSON.parse(await reader.readAll())); } catch (err) { /* not a message */ }
  });
  room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { if (p.identity === BACKEND) leave(); }); // a new session
  room.on(LK.RoomEvent.Disconnected, leave);
  try {
    await room.connect(token.server_url, token.participant_token);
  } catch (err) {
    leave();
  }
}

function leave() {
  if (!room) return;
  const old = room;
  room = null;
  old.removeAllListeners();
  old.disconnect();
  clearVideo();
  fadeAll(performance.now());
  names.clear();
  updatedAt = null;
  setTimeout(join, 1000);
}

join();
requestAnimationFrame(draw);
</script>
</body>
</html>
