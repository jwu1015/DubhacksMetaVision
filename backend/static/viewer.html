<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront · Live</title>
<style>
  /* The app's Lime palette and glass (frontend/Spotted/Design). */
  :root {
    color-scheme: dark;
    --ink: #0a0a0c;
    --surface: #16161a;
    --surface-raised: #222228;
    --separator: #2c2c32;
    --on-accent: #0a0a0c;
    --label: #ffffff;
    --label-secondary: #a1a1aa;
    --accent: #c8ff3d;
    --success: #30d158;
    --warning: #ffd60a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--label); font: 15px/1.3 var(--font); }
  #app { position: fixed; inset: 0; display: flex; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; }
  #overlay { pointer-events: none; }
  .glass {
    background: rgba(22, 22, 26, 0.62); border: 1px solid rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
  }
  #waiting { position: absolute; inset: 0; display: grid; place-items: center; color: var(--label-secondary); }
  #status {
    position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 10px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
  #status.live .dot { background: var(--accent); }
  /* The item the user picked, and where to buy it. */
  #look {
    flex: 0 0 min(34vw, 420px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    background: var(--surface); border-left: 1px solid var(--separator);
  }
  #crop { aspect-ratio: 4 / 3; border-radius: 20px; background: var(--ink) center / contain no-repeat; }
  #name { font-size: 22px; font-weight: 700; line-height: 1.15; }
  #desc, #look-status, .sub { color: var(--label-secondary); font-size: 13px; }
  #desc { margin-top: 4px; }
  #look-status.busy { animation: pulse 1.4s ease-in-out infinite; }
  #look-status.error { color: var(--warning); }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
          background: rgba(255, 255, 255, 0.1); font-size: 12px; font-weight: 500; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label-secondary); }
  .chip.low .dot { background: var(--success); }
  .chip.high .dot { background: var(--warning); }
  .chip.exact { background: var(--accent); color: var(--on-accent); }
  .tag { margin-bottom: 6px; }
  .product { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .best { padding: 12px; border-radius: 20px; background: var(--surface-raised); }
  .thumb { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--surface-raised) center / cover; }
  .best .thumb { width: 56px; height: 56px; border-radius: 14px; background-color: var(--ink); }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .best .price { font-size: 22px; }
  .save { color: var(--success); }
  h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--label-secondary); }
  .group { display: flex; flex-direction: column; gap: 10px; }
  @keyframes pulse { 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="waiting">Waiting for video…</div>
    <div id="status" class="glass"><span class="dot"></span><span id="status-text">Connecting…</span></div>
  </main>
  <aside id="look" hidden aria-live="polite">
    <div id="crop"></div>
    <div><div id="name"></div><div id="desc"></div></div>
    <div id="look-status"></div>
    <div id="results" class="group"></div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
<script>
"use strict";
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const waiting = document.getElementById("waiting");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();

const MOVE_MS = 150;      // a label glides to its new position
const FADE_IN_MS = 80;
const FADE_OUT_MS = 200;  // a label missing from the latest update fades out
const DIM = 0.35;         // the other labels, while one is picked
const TOP = 4;            // labels shown in full; the other labeled objects get a dot
const W_SCORE = 0.2, W_SIZE = 0.8; // how labels are ranked: SAM's score and the box's share of the frame

// Positions arrive a few times a second; between updates each label stays where it was last seen.
const tracks = new Map(); // uid -> {uid, label, from, to, t0, born, gone}
const names = new Map();  // uid -> its quick label: {name, price_low, price_high}
let updatedAt = null;     // performance.now() when the frame behind the latest boxes was captured
let count = 0;
let tracking = "connecting";

function ease(k) { return 1 - Math.pow(1 - k, 3); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

function boxAt(t, now) {
  const k = ease(Math.min(1, (now - t.t0) / MOVE_MS));
  return t.from.map((v, i) => v + (t.to[i] - v) * k);
}

function alphaAt(t, now) {
  const a = Math.min(1, (now - t.born) / FADE_IN_MS);
  return t.gone === null ? a : a * Math.max(0, 1 - (now - t.gone) / FADE_OUT_MS);
}

function fadeAll(now) {
  for (const t of tracks.values()) if (t.gone === null) t.gone = now;
}

function onObjects(ev) {
  const now = performance.now();
  if (!ev.objects.length) { fadeAll(now); names.clear(); updatedAt = null; return; } // tracking restarted
  updatedAt = now - ev.age_ms;
  const inView = ev.objects.filter((o) => o.in_view); // scene memory also lists objects that left
  count = inView.length;
  const seen = new Set();
  for (const o of inView) {
    const [x1, y1, x2, y2] = o.box, box = [x1, y1, x2 - x1, y2 - y1];
    const t = tracks.get(o.uid);
    seen.add(o.uid);
    if (t) {
      t.from = boxAt(t, now);
      t.born = now - alphaAt(t, now) * FADE_IN_MS; // fading out: fade back in from where it is
      t.to = box; t.t0 = now; t.gone = null; t.label = o.prompt; t.score = o.score;
    } else {
      tracks.set(o.uid, { uid: o.uid, label: o.prompt, score: o.score, from: box, to: box, t0: now, born: now,
                          gone: null });
    }
  }
  for (const [uid, t] of tracks) if (!seen.has(uid) && t.gone === null) t.gone = now;
}

function handle(ev) {
  if (ev.type === "objects") {
    onObjects(ev);
  } else if (ev.type === "label") {
    names.set(ev.uid, { ...ev, at: performance.now() });
  } else if (ev.type === "status") {
    tracking = ev.tracking;
    if (tracking === "stopped") { fadeAll(performance.now()); names.clear(); updatedAt = null; }
  } else if (ev.type === "look" && ev.selected) {
    showLook(ev);
  }
}

// ---------- the sidebar: the item the user picked, and where to buy it ----------

const $ = (id) => document.getElementById(id);
const VERDICT = { low: "Good price", fair: "Fair price", high: "Pricey" };
const EXACT = 85;         // match_score from here up is an "Exact match", as in the app
let look = null;          // the picked Look in the sidebar: {look_id, uid, name, price}
const picks = new Set();  // look_ids of every pick so far: the newest one is in the sidebar

// Each "look" message carries the whole Look so far, so the sidebar is drawn from it alone.
function showLook(ev) {
  if (!picks.has(ev.look_id)) picks.add(ev.look_id); // a new pick takes the sidebar
  else if (!look || ev.look_id !== look.look_id) return; // an older pick, already replaced
  const s = ev.stage === "results" ? ev.search : null, best = s && s.best_match;
  look = { look_id: ev.look_id, uid: ev.uid, name: cap((ev.item && ev.item.category) || ev.label),
           price: best ? money(best.price, best.currency) : null };
  $("look").hidden = false;
  $("crop").hidden = !ev.crop_url;
  $("crop").style.backgroundImage = cssUrl(ev.crop_url);
  $("name").textContent = look.name;
  $("desc").textContent = (ev.item && ev.item.description) || "";
  const st = $("look-status");
  st.className = ev.stage === "failed" ? "error" : s ? "" : "busy";
  st.textContent = ev.stage === "failed" ? ev.message || "Couldn't get prices." : s ? "" : "Finding prices…";
  st.hidden = !st.textContent;
  $("results").replaceChildren(...(s ? results(s) : []));
}

function results(s) {
  const parts = [];
  if (s.best_match) {
    const pi = s.price_insight, chips = el("div", "chips");
    const verdict = el("span", "chip " + pi.best_match_verdict);
    verdict.append(el("span", "dot"), VERDICT[pi.best_match_verdict] || "Price");
    chips.append(verdict);
    if (pi.typical_low != null && pi.typical_high != null) {
      chips.append(el("span", "sub", "typical " + money(pi.typical_low) + "–" + money(pi.typical_high)));
    }
    parts.push(chips, product(s.best_match, true));
  } else {
    parts.push(el("div", "sub", s.spoken_summary || "No exact match for sale."));
  }
  if (s.dupes.length) parts.push(group("Cheaper dupes", s.dupes));
  if (s.used.length) parts.push(group("Used", s.used));
  return parts;
}

function product(p, best) {
  const info = el("div", "info");
  if (best) {
    const exact = p.match_score != null && p.match_score >= EXACT;
    const tag = el("div", "chips tag");
    tag.append(el("span", "chip" + (exact ? " exact" : ""), exact ? "Exact match" : "Similar"));
    info.append(tag);
  }
  const sub = el("div", "sub", p.store);
  if (!best && p.savings_pct) sub.append(" · ", el("span", "save", "Save " + p.savings_pct + "%"));
  info.append(el("div", "title", p.title), sub);
  const thumb = el("div", "thumb");
  thumb.style.backgroundImage = cssUrl(p.image_url);
  const row = el("div", "product" + (best ? " best" : ""));
  row.append(thumb, info, el("div", "price", money(p.price, p.currency)));
  return row;
}

function group(name, products) {
  const g = el("section", "group");
  g.append(el("h2", "", name), ...products.slice(0, 2).map((p) => product(p, false)));
  return g;
}

// Store data comes from the web: it only ever goes in as text, and images only from http(s) URLs.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function cssUrl(src) {
  let url = null;
  try { url = src ? new URL(src, location.href) : null; } catch (err) { /* no picture */ }
  const ok = url && (url.protocol === "https:" || url.protocol === "http:");
  return ok ? 'url("' + url.href.replace(/"/g, "%22") + '")' : "";
}

function money(value, currency) {
  try {
    return new Intl.NumberFormat("en-US", { style: "currency", currency: currency || "USD",
      maximumFractionDigits: Number.isInteger(value) || value >= 100 ? 0 : 2 }).format(value);
  } catch (err) { // an unknown currency code
    return "$" + Math.round(value);
  }
}

function estimate(q) { // "~$30–50", as the app's hotspots say it
  return q.price_low === q.price_high ? "~$" + q.price_low : "~$" + q.price_low + "–" + q.price_high;
}

// ---------- drawing: the app's hotspots over the video ----------

let cw = 0, ch = 0, dpr = 0;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, r = devicePixelRatio || 1;
  if (w === cw && h === ch && r === dpr) return;
  cw = w; ch = h; dpr = r;
  canvas.width = Math.round(w * r);
  canvas.height = Math.round(h * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
}

function videoRect() {
  const iw = video.videoWidth, ih = video.videoHeight;
  if (!iw || !ih) return null;
  const s = Math.min(cw / iw, ch / ih), w = iw * s, h = ih * s;
  return { x: (cw - w) / 2, y: (ch - h) / 2, w: w, h: h };
}

function rank(t, b) {
  return W_SCORE * t.score + W_SIZE * b[2] * b[3];
}

// Only objects with a quick label are drawn, at the middle of their box. The TOP best ranked get a hotspot
// (name and estimate on glass), the rest a dot saying something was found; the picked one turns lime.
function drawLabel(t, b, alpha, v, font, full, picked) {
  const q = names.get(t.uid);
  if (!picked && !q) return;
  if (q) alpha *= Math.min(1, (performance.now() - q.at) / FADE_IN_MS);
  const cx = v.x + (b[0] + b[2] / 2) * v.w, cy = v.y + (b[1] + b[3] / 2) * v.h;
  ctx.globalAlpha = alpha;
  ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
  ctx.shadowBlur = 3;
  ctx.shadowOffsetY = 1;
  if (!picked && !full) {
    ctx.beginPath();
    ctx.arc(cx, cy, 3.5, 0, 2 * Math.PI);
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.fill();
  } else {
    const name = picked ? picked.name : cap(q.name), price = picked ? picked.price || "" : estimate(q);
    ctx.font = "500 " + font + "px " + FONT;
    const gap = font * 0.5, nw = ctx.measureText(name).width, pw = price ? ctx.measureText(price).width : 0;
    const w = font * 0.85 + nw + (price ? gap + pw : 0) + font, h = font * 2;
    const x = Math.max(v.x, Math.min(cx - w / 2, v.x + v.w - w)), y = Math.max(v.y, Math.min(cy - h / 2, v.y + v.h - h));
    roundRect(x, y, w, h, h / 2);
    ctx.fillStyle = picked ? "#c8ff3d" : "rgba(22, 22, 26, 0.78)";
    ctx.fill();
    ctx.shadowColor = "transparent";
    if (!picked) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
      ctx.stroke();
    }
    ctx.textBaseline = "middle";
    ctx.fillStyle = picked ? "#0a0a0c" : "#fff";
    ctx.fillText(name, x + font * 0.85, y + h / 2);
    if (price) {
      ctx.fillStyle = picked ? "#0a0a0c" : "#a1a1aa";
      ctx.fillText(price, x + font * 0.85 + nw + gap, y + h / 2);
    }
  }
  ctx.shadowColor = "transparent";
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2)));
}

let shownText = "";

function updateStatus() {
  const live = tracking === "ok" || tracking === "starting";
  const text = tracking === "connecting" ? "Connecting…" : tracking === "stopped" ? "Waiting for the phone"
    : tracking === "offline" ? "Tracking offline" : updatedAt === null ? "Live · Finding items…"
    : "Live · " + count + (count === 1 ? " item" : " items");
  if (text !== shownText) statusText.textContent = shownText = text;
  statusEl.classList.toggle("live", live);
}

function draw() {
  const now = performance.now();
  resize();
  ctx.clearRect(0, 0, cw, ch);
  const v = videoRect();
  waiting.hidden = !!v;
  if (v) {
    const font = Math.round(Math.max(11, Math.min(v.h * 0.016, 13)));
    for (const [key, t] of tracks) if (t.gone !== null && alphaAt(t, now) <= 0) tracks.delete(key);
    const picked = look ? tracks.get(look.uid) : undefined;
    const labeled = [...tracks.values()].filter((t) => t !== picked && names.has(t.uid) && t.gone === null)
      .map((t) => ({ t, b: boxAt(t, now) })).sort((a, z) => rank(z.t, z.b) - rank(a.t, a.b));
    const top = new Set(labeled.slice(0, TOP).map((x) => x.t));
    for (const t of tracks.values()) {
      if (t !== picked) drawLabel(t, boxAt(t, now), alphaAt(t, now) * (picked ? DIM : 1), v, font, top.has(t));
    }
    if (picked) drawLabel(picked, boxAt(picked, now), alphaAt(picked, now), v, font, true, look);
  }
  updateStatus();
  requestAnimationFrame(draw);
}

// ---------- the session's LiveKit room, watch only ----------

const LK = LivekitClient;
const TOPIC = "updates";   // the backend's messages: data packets, and text streams for "look"
const BACKEND = "vision";  // its identity in the room
let room = null;

function clearVideo() {
  video.srcObject = null;
  video.removeAttribute("src");
}

async function join() {
  tracking = "connecting";
  let token;
  try {
    const r = await fetch("viewer-token", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "no session yet" : "HTTP " + r.status);
    token = await r.json();
  } catch (err) {
    setTimeout(join, 2000);  // no session yet, or the server is restarting
    return;
  }
  room = new LK.Room();
  room.on(LK.RoomEvent.TrackSubscribed, (track, pub, participant) => {
    if (track.kind === "video" && participant.identity.startsWith("phone-")) track.attach(video);
  });
  room.on(LK.RoomEvent.TrackUnsubscribed, (track) => { track.detach(video); clearVideo(); });
  room.on(LK.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
    if (topic !== TOPIC || !participant || participant.identity !== BACKEND) return;
    try { handle(JSON.parse(new TextDecoder().decode(payload))); } catch (err) { /* not a message */ }
  });
  room.registerTextStreamHandler(TOPIC, async (reader, from) => {
    if (from.identity !== BACKEND) return;
    try { handle(JSON.parse(await reader.readAll())); } catch (err) { /* not a message */ }
  });
  room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { if (p.identity === BACKEND) leave(); }); // a new session
  room.on(LK.RoomEvent.Disconnected, leave);
  try {
    await room.connect(token.server_url, token.participant_token);
  } catch (err) {
    leave();
  }
}

function leave() {
  if (!room) return;
  const old = room;
  room = null;
  old.removeAllListeners();
  old.disconnect();
  clearVideo();
  fadeAll(performance.now());
  names.clear();
  updatedAt = null;
  setTimeout(join, 1000);
}

join();
requestAnimationFrame(draw);
</script>
</body>
</html>
